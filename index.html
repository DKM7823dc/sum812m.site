    <style>
        /* ── reset & base ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: #f9fafb;
            color: #111827;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        img { display: block; max-width: 100%; }
        a { text-decoration: none; color: inherit; }
        ::selection { background: #2563eb; color: #fff; }

        .container { max-width: 1120px; margin: 0 auto; padding: 0 28px; }

        .label-sm {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #2563eb;
            margin-bottom: 12px;
            border-left: 2px solid #2563eb;
            padding-left: 12px;
        }
        .heading-lg {
            font-size: clamp(2.2rem, 4.4vw, 3.6rem);
            font-weight: 900;
            line-height: 1.12;
            letter-spacing: -0.03em;
            color: #0b1e33;
        }
        .heading-md {
            font-size: clamp(1.6rem, 2.8vw, 2.2rem);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.03em;
            color: #0b1e33;
        }
        .text-muted { color: #4b5563; font-size: clamp(0.9rem, 1.2vw, 1rem); line-height: 1.75; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: -0.01em;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.3);
        }
        .btn-outline {
            background: transparent;
            color: #111827;
            border: 1.5px solid #d1d5db;
        }
        .btn-outline:hover { border-color: #2563eb; color: #2563eb; transform: translateY(-2px); }

        /* ── nav ── */
        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            padding: 0 28px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid #e5e7eb;
        }
        .nav .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1120px;
            padding: 0;
        }
        .nav-logo { font-size: 1.05rem; font-weight: 900; color: #0b1e33; letter-spacing: -0.03em; }
        .nav-logo span { color: #2563eb; }
        .nav-links { display: flex; align-items: center; gap: 6px; }
        .nav-links a {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
            color: #4b5563;
            transition: color 0.25s ease, background 0.25s ease;
        }
        .nav-links a:hover { color: #0b1e33; background: rgba(37,99,235,0.06); }
        .nav-cta {
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            background: #2563eb;
            color: #fff;
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(37,99,235,0.2);
        }
        .nav-cta:hover { background: #1d4ed8; transform: translateY(-1px); }

        /* ── hero ── */
        .hero {
            padding: 120px 0 80px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #f9fafb 0%, #eef2ff 100%);
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 70%;
            height: 120%;
            background: radial-gradient(ellipse at 70% 50%, rgba(37,99,235,0.06), transparent 70%);
            pointer-events: none;
        }
        .hero .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(40px, 6vw, 72px);
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .hero-content .label-sm { border-left-color: #2563eb; margin-bottom: 8px; }
        .hero-content h1 {
            font-size: clamp(2.4rem, 4.6vw, 3.8rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.03em;
            color: #0b1e33;
            margin-bottom: 18px;
        }
        .hero-content h1 em { font-style: normal; color: #2563eb; }
        .hero-content h1 span { color: #f59e0b; }
        .hero-content p {
            font-size: clamp(0.95rem, 1.3vw, 1.05rem);
            color: #4b5563;
            line-height: 1.75;
            margin-bottom: 24px;
            max-width: 480px;
        }
        .hero-btns {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            font-size: 0.8rem;
            color: #6b7280;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .hero-meta span { display: inline-flex; align-items: center; gap: 4px; }
        .hero-meta .dot { color: #2563eb; }

        /* ── 图片容器：等比例缩放 ── */
        .hero-img {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.12);
            position: relative;
            background: #e5e7eb;
            width: 100%;
        }
        .hero-img img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;  /* 可自行调整为所需比例，如 4/3 或 21/9 */
            object-fit: cover;      /* 保证填满容器，若想完整显示可用 contain */
            background: #e5e7eb;
        }
        .hero-img::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(249,250,251,0.2) 100%);
            pointer-events: none;
        }

        /* ── 其余样式（完全保持原样） ── */
        /* ticker, why, curriculum, method, benefits, cta, footer, float bar, modal 等均未改动，此处省略以节省篇幅，实际使用时请保留完整样式 */

        /* 响应式调整：小屏幕下保持左右布局，但可改为堆叠（原代码已有 @media 处理） */
        @media (max-width: 768px) {
            .hero .container {
                grid-template-columns: 1fr; /* 移动端变为上下布局，与原始代码一致 */
                gap: 32px;
            }
            .hero { padding: 96px 0 56px; }
            .hero-content p { max-width: 100%; }
            .hero-img img { aspect-ratio: 16 / 9; } /* 移动端可调整比例 */
        }

        /* 其他响应式、modal、float bar 等全部保留原样，不再重复 */
    </style>
</head>
